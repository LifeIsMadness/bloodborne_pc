name: Build Windows test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env: 
      MSYS2_ROOT: /

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true

      - name: Install build dependencies
        run: |
          pacman -S --needed --noconfirm \
            git patch \
            mingw-w64-clang-x86_64-{toolchain,cmake,ninja,pkgconf,python} \
            mingw-w64-clang-x86_64-{vulkan-headers,vulkan-loader,vulkan-memory-allocator,glslang} \
            mingw-w64-clang-x86_64-{sdl3,fmt,boost,robin-map,xxhash,ffmpeg,zydis} \
            mingw-w64-clang-x86_64-{spirv-tools,spirv-headers,spirv-cross} \
            mingw-w64-clang-x86_64-{protobuf,openssl,zlib,miniupnpc,nlohmann-json}

      - name: Build project
        run: bash build.sh

      - name: Checkout NVIDIA DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          path: NVIDIA-DLSS
          persist-credentials: false

      - name: Build DLSS bridge
        env:
          DLSS_SDK_ROOT: ${{ github.workspace }}/NVIDIA-DLSS
        run: |
          # MSYS2 CMake cannot generate Visual Studio projects; use runner's Windows CMake.
          export CMAKE_EXE="$(cygpath -u 'C:/Program Files/CMake/bin/cmake.exe')"
          export DLSS_SDK_ROOT="$(cygpath -u "$DLSS_SDK_ROOT")"
          bash packaging/windows/build_dlss.sh
          test -s out/bbport_dlss.dll
          test -s out/nvngx_dlss.dll
          test -s out/nvngx_dlssg.dll

      - name: Package Windows release
        run: bash packaging/windows/package.sh --zip-only

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: bloodborne-windows-test
          path: dist/bbport-windows.zip
          if-no-files-found: error
          compression-level: 0
